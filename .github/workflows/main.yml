name: Main

on:
  push:
    branches: [main]

jobs:
  soundness:
    name: Soundness
    uses: ./.github/workflows/soundness.yml
    secrets:
      PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
    with:
      linux_pre_build_command: cd tests/TestPackage
      api_breakage_check_enabled: false

  unit-tests:
    name: Unit tests
    uses: ./.github/workflows/unit_tests.yml
    secrets:
      PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
    with:
      macos_6_1_enabled: true
      macos_6_2_enabled: true
      macos_6_3_enabled: true
      macos_6_4_enabled: true
      macos_6_4_runs-on: xcode-27
      macos_build_command_options: "-Xswiftc -warnings-as-errors --explicit-target-dependency-import-check error"
      macos_pre_build_command: |
        cd tests/TestPackage
        swift build

      linux_6_1_enabled: true
      linux_6_2_enabled: true
      linux_6_3_enabled: true
      linux_6_4_enabled: true
      linux_nightly_release_enabled: true
      linux_nightly_main_enabled: true
      linux_build_command_options: "-Xswiftc -warnings-as-errors --explicit-target-dependency-import-check error"
      linux_nightly_main_build_command_options: "--explicit-target-dependency-import-check error"
      linux_pre_build_command: |
        cd tests/TestPackage
        swift build

      windows_6_1_enabled: true
      windows_6_2_enabled: true
      windows_6_3_enabled: true
      windows_6_4_enabled: true
      windows_nightly_release_enabled: true
      windows_nightly_main_enabled: true
      windows_build_command_options: "-Xswiftc -warnings-as-errors --explicit-target-dependency-import-check error"
      windows_nightly_main_build_command_options: "--explicit-target-dependency-import-check error"
      windows_pre_build_command: |
        cd tests/TestPackage
        swift build
